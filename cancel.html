<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAYMENT INCOMPLETE // AFSAR'S QUEST</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0A0A0A;
      --crimson: #8B0000;
      --text: #F0F0F0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle ambient spotlight */
    .ambient-glow {
      position: fixed;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(139, 0, 0, 0.14) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      filter: blur(80px);
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 540px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Icon */
    .icon-wrap {
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1px solid rgba(139, 0, 0, 0.4);
      background: rgba(139, 0, 0, 0.06);
      box-shadow: 0 0 30px rgba(139, 0, 0, 0.2);
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
      display: block;
    }

    /* Main Heading */
    h1.heading {
      font-family: 'Anton', Impact, sans-serif;
      font-size: clamp(38px, 6vw, 56px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 18px;
      line-height: 1.1;
      font-weight: 400;
    }

    /* Subtext */
    p.subtext {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 36px;
      max-width: 480px;
    }

    /* Button */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--crimson);
      background: transparent;
      border: 1px solid var(--crimson);
      padding: 14px 38px;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-retry:hover {
      background: var(--crimson);
      color: #FFFFFF;
      box-shadow: 0 0 25px rgba(139, 0, 0, 0.45);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <main class="container">
    <div class="icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8B0000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>

    <h1 class="heading">PAYMENT INCOMPLETE</h1>

    <p class="subtext">
      Your transaction was cancelled or interrupted. No funds were deducted.
    </p>

    <a href="index.html" class="btn-retry">TRY AGAIN</a>
  </main>
</body>
</html>

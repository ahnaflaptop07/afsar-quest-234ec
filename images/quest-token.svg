<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coinBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="25%" stop-color="#F5D76E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#9E7B15"/>
      <stop offset="100%" stop-color="#5A4305"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE8"/>
      <stop offset="30%" stop-color="#E6C250"/>
      <stop offset="60%" stop-color="#8C6809"/>
      <stop offset="85%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#382800"/>
    </linearGradient>
    <radialGradient id="innerBevel" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#B88E18"/>
      <stop offset="70%" stop-color="#785A09"/>
      <stop offset="100%" stop-color="#3D2A00"/>
    </radialGradient>
    <linearGradient id="apertureGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#8F6A0D"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#D4AF37" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="innerEmboss">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#FFF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="256" cy="256" r="230" fill="#D4AF37" opacity="0.15" filter="blur(30px)"/>

  <!-- Main 3D Outer Coin with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Outer Rim -->
    <circle cx="256" cy="256" r="210" fill="url(#goldRim)" stroke="#FFF9D2" stroke-width="3"/>
    <!-- Grooved Teeth Border -->
    <circle cx="256" cy="256" r="200" fill="none" stroke="#694D05" stroke-width="4" stroke-dasharray="5, 4"/>
    <circle cx="256" cy="256" r="194" fill="none" stroke="#FEE589" stroke-width="2"/>
    <!-- Inner Recessed Field -->
    <circle cx="256" cy="256" r="186" fill="url(#coinBody)"/>
    <!-- Center Beveled Core -->
    <circle cx="256" cy="256" r="154" fill="url(#innerBevel)" stroke="#D4AF37" stroke-width="3"/>
    <!-- Inner Ridge -->
    <circle cx="256" cy="256" r="146" fill="none" stroke="#FCEAA0" stroke-width="1.5" stroke-dasharray="2, 2"/>
  </g>

  <!-- Embossed Insignia: Camera Aperture + Quest Emblem -->
  <g filter="url(#innerEmboss)" fill="url(#apertureGold)">
    <!-- Center Hexagonal Aperture Blades -->
    <polygon points="256,170 326,212 326,296 256,338 186,296 186,212" fill="none" stroke="url(#apertureGold)" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="256" cy="256" r="42" fill="#1A1404" stroke="url(#apertureGold)" stroke-width="4"/>
    <!-- Aperture Blades -->
    <line x1="256" y1="170" x2="276" y2="220" stroke="url(#apertureGold)" stroke-width="4"/>
    <line x1="326" y1="212" x2="290" y2="266" stroke="url(#apertureGold)" stroke-width="4"/>
    <line x1="326" y1="296" x2="270" y2="292" stroke="url(#apertureGold)" stroke-width="4"/>
    <line x1="256" y1="338" x2="236" y2="292" stroke="url(#apertureGold)" stroke-width="4"/>
    <line x1="186" y1="296" x2="222" y2="246" stroke="url(#apertureGold)" stroke-width="4"/>
    <line x1="186" y1="212" x2="242" y2="220" stroke="url(#apertureGold)" stroke-width="4"/>
    
    <!-- Central Eye / Core Diamond -->
    <polygon points="256,236 274,256 256,276 238,256" fill="#FFEFA8"/>
    <circle cx="256" cy="256" r="5" fill="#241B03"/>
  </g>

  <!-- Embossed Typography along Circumference -->
  <path id="textPathTop" d="M 100,256 A 156,156 0 0,1 412,256" fill="none"/>
  <path id="textPathBottom" d="M 412,256 A 156,156 0 0,1 100,256" fill="none"/>

  <text font-family="Arial, sans-serif" font-size="19" font-weight="900" letter-spacing="5" fill="#FFF2B5" filter="url(#innerEmboss)">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ★ AFSAR'S QUEST ★
    </textPath>
  </text>

  <text font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="4" fill="#E0BC48" filter="url(#innerEmboss)">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      TRUTH • RESEARCH • PATRON
    </textPath>
  </text>
  
  <!-- Metallic Specular Light Glint -->
  <path d="M 120,130 Q 210,95 280,105" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="blur(1.5px)" fill="none"/>
  <circle cx="128" cy="128" r="8" fill="#FFFFFF" opacity="0.8" filter="blur(2px)"/>
</svg>

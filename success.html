<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DONATION SUCCESSFUL // AFSAR'S QUEST</title>

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://afsarsquest.netlify.app/">
  <meta property="og:title" content="Afsar's Quest | Unmasking Global Power">
  <meta property="og:description" content="Independent geopolitical analysis and investigative documentary platform. No corporate advertisers, no censorship—just unfiltered truth and bold journalism.">
  <meta property="og:image" content="https://afsarsquest.netlify.app/founder.jpg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://afsarsquest.netlify.app/">
  <meta name="twitter:title" content="Afsar's Quest | Unmasking Global Power">
  <meta name="twitter:description" content="Independent geopolitical analysis and investigative documentary platform. No corporate advertisers, no censorship—just unfiltered truth and bold journalism.">
  <meta name="twitter:image" content="https://afsarsquest.netlify.app/founder.jpg">

  <!-- Security Logic: Redirect immediately if status is not 'success' -->
  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const status = (urlParams.get('status') || '').trim().toLowerCase();
      if (status !== 'success') {
        window.location.replace('cancel.html');
      }
    })();
  </script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0A0A0A;
      --gold: #D4AF37;
      --text: #F0F0F0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle ambient spotlight */
    .ambient-glow {
      position: fixed;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      filter: blur(80px);
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 580px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Icon */
    .icon-wrap {
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: rgba(212, 175, 55, 0.05);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
    }

    .icon-wrap svg {
      width: 38px;
      height: 38px;
      display: block;
    }

    /* Main Heading */
    h1.heading {
      font-family: 'Anton', Impact, sans-serif;
      font-size: clamp(38px, 6vw, 56px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
      line-height: 1.1;
      font-weight: 400;
    }

    /* Subtext */
    p.subtext {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 36px;
      max-width: 520px;
    }

    .highlight {
      color: var(--gold);
      font-weight: 600;
    }

    /* Button */
    .btn-return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      background: transparent;
      border: 1px solid var(--gold);
      padding: 14px 38px;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-return:hover {
      background: var(--gold);
      color: #0A0A0A;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <main class="container">
    <div class="icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1 class="heading">DONATION SUCCESSFUL</h1>

    <p class="subtext">
      Thank you for funding independent truth. Your transaction <span id="trx-id" class="highlight">[transactionId]</span> for ৳<span id="amt-val" class="highlight">[paymentAmount]</span> is confirmed.
    </p>

    <a href="index.html" class="btn-return">RETURN TO HOME</a>
  </main>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const transactionId = urlParams.get('transactionId') || 
                            urlParams.get('transaction_id') || 
                            urlParams.get('trx_id') || 
                            urlParams.get('tran_id') || 
                            urlParams.get('tx_id') || 
                            'AQ-' + Math.floor(100000 + Math.random() * 900000);

      const rawAmount = urlParams.get('paymentAmount') || 
                        urlParams.get('amount') || 
                        urlParams.get('paid_amount') || 
                        '1000';

      let formattedAmount = rawAmount.toString().replace(/[^0-9.,]/g, '');
      if (!formattedAmount) formattedAmount = '1,000';

      const trxEl = document.getElementById('trx-id');
      const amtEl = document.getElementById('amt-val');
      if (trxEl) trxEl.textContent = transactionId;
      if (amtEl) amtEl.textContent = formattedAmount;
    })();
  </script>
</body>
</html>

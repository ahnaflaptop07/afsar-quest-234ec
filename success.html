<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contribution Confirmed | AFSAR'S QUEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0C0C0C;
      color: #F0F0F0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 2;
      background: #141414;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 56px 40px;
      max-width: 560px;
      width: 100%;
      border-radius: 4px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85);
    }
    .token-img {
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.4));
    }
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: #D4AF37;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Anton', Impact, sans-serif;
      font-size: clamp(34px, 5vw, 46px);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #F0F0F0;
      margin-bottom: 16px;
      line-height: 1.1;
    }
    p {
      font-size: 15px;
      font-weight: 300;
      color: #A0A0A0;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .btn-home {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #0C0C0C;
      background: #D4AF37;
      padding: 16px 36px;
      border-radius: 2px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .btn-home:hover {
      background: #8B0000;
      color: #FFFFFF;
      box-shadow: 0 0 25px rgba(139, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="card">
    <img src="images/quest-token.svg" alt="Afsar's Quest Token" class="token-img">
    <div class="tag">PATRON VERIFIED // DESHI PAY</div>
    <h1>MISSION FUNDED</h1>
    <p>
      Thank you for your fearless patronage. Your contribution directly fuels independent investigations, encrypted dispatches, and geopolitical research. The truth remains uncompromised.
    </p>
    <a href="/" class="btn-home">RETURN TO THE QUEST</a>
  </div>
</body>
</html>
